# CodeRabbit Configuration
# Reduces false positive suggestions based on project patterns

version: 2

reviews:
  # Path filters - skip files that don't need code review
  path_filters:
    - "!docs/**"
    - "!**/*.md"
    - "!scripts/utils/**"
    - "!__mocks__/**"

  # Focus on actionable issues, reduce speculative suggestions
  auto_review:
    enabled: true
    drafts: false

  # Custom instructions for this codebase, applied to all files
  path_instructions:
    - path: "**/*"
      instructions: |
        ## Project Context
        This is a Next.js 14 + Convex + Clerk application for career development.

        ## Patterns to Accept (Don't Flag)

        ### Convex Type Safety
        - Trust Convex query/mutation results - validators enforce types at runtime
        - Don't suggest undefined/null guards for schema-validated fields (e.g., `status`, `stage`)
        - `v.id()` validators handle ID format validation - no additional guards needed
        - `v.union(v.literal(...))` ensures only valid enum values - no fallback guards needed
        - Schema uses `v.union(v.number(), v.null())` intentionally for clearable fields
        - String-based error detection (e.g., `includes('ArgumentValidationError:')`) is acceptable

        ### Authentication & convexServer Shim
        - `convexServer.query/mutation/action` accepts token as THIRD parameter (see src/lib/convex-server.ts)
        - The shim wraps token as `{ token }` internally - don't suggest removing token parameter
        - `requireConvexToken()` handles auth validation and returns `{ userId, token }`
        - Clerk `publicMetadata.role` is the source of truth for authorization
        - `getCurrentUser(ctx, args.clerkId)` validates clerkId against JWT - don't flag as insecure

        ### Error Handling Architecture
        - Dialog/modal components often delegate error handling to parent callbacks
        - Check CALLER functions for try-catch before suggesting error handling in child components
        - Errors that re-throw after toast allow parent to know operation failed
        - PII sanitization belongs at logging infrastructure level, not individual sanitizeError functions

        ### Idempotent Operations
        - Session cancellation is idempotent - status check is sufficient, no version check needed
        - Soft delete operations are idempotent - can be called multiple times safely

        ### Performance
        - Don't suggest index optimizations without evidence of actual performance issues
        - Don't flag one-time migration scripts for pagination unless dataset is large

        ### Testing
        - Mock implementations in `__mocks__/` are intentionally simplified
        - Don't suggest making test mocks more realistic unless tests are failing

        ### Style
        - Don't suggest documentation-only changes
        - Don't flag null vs undefined unless it causes actual bugs
        - Stage vs status case differences are intentional (title case for new, lowercase for legacy)

        ### University Invite Flow
        - Invite tokens are validated server-side via `/api/university/verify-invite` BEFORE setting `unsafeMetadata`
        - The Clerk webhook does NOT use `unsafeMetadata` - it looks up user's `university_id` from Convex database
        - Don't suggest re-verifying invite tokens in webhooks - they're already validated before signup

        ### Audit Logs & Timestamps
        - Audit logs always have either `created_at` (new format) or `timestamp` (legacy format)
        - `createAuditLog` helper always sets `created_at: Date.now()`
        - Fallback timestamps are defensive guards for theoretical data corruption, not expected code paths
        - Don't suggest replacing `Date.now()` fallbacks with "Unknown" strings

        ### Accessibility
        - Elements with `role="button"` containing visible text get accessible names from content (WCAG)
        - Don't suggest adding `aria-label` to clickable cards/elements that contain descriptive text
        - Only suggest `aria-label` when interactive elements have NO visible text content

        ### Async Patterns
        - Fire-and-forget async calls are intentional when `setIsLoading(true)` runs synchronously at function start
        - Example: `handleQuickAction() { handleAsync(); }` is fine if `handleAsync` sets loading state first
        - Don't suggest adding `await` to wrapper functions that just trigger async operations
        - The synchronous state update disables buttons before any async work begins

        ### React Query (TanStack Query)
        - `useMutation` return objects are stable references - safe to include in useEffect dependencies
        - Don't suggest extracting `.mutate` to separate refs - the mutation object itself is stable
        - Guards like `!mutation.isPending` in useEffect conditions prevent re-calling during pending state
        - React Query mutations do NOT cause infinite loops when included in dependency arrays

        ### React State Patterns
        - Functional updates `setState((prev) => ...)` execute synchronously within the same tick
        - Refs set inside functional update callbacks are available immediately after the setState call
        - Pattern: `setHistoryState((prev) => { ref.current = value; return newState; }); return ref.current;` is valid
        - Don't suggest reading state directly instead of functional updates - that introduces stale closures
        - React 18 batching doesn't change synchronous execution of functional update callbacks

        ### Environment Variables
        - Don't suggest renaming environment variables for "consistency" - breaking changes with no functional benefit
        - Existing env var names (e.g., ADZUNA_APPLICATION_ID) should be preserved

        ### Authorization Layer Architecture
        - Ownership/permission checks often exist at the Convex data layer, not the API route
        - Check Convex query/mutation handlers before suggesting "missing" authorization in API routes
        - Pattern: API route calls `getSession({ sessionId })` → Convex query validates user owns session
        - Don't flag "missing ownership validation" without checking the Convex function implementation

        ### Webhook Security Models
        - Gmail uses URL token verification (GMAIL_PUBSUB_VERIFICATION_TOKEN)
        - Outlook uses clientState hash validation in the notification payload
        - Both are valid security models - don't suggest one should match the other
        - Microsoft Graph webhooks validate via clientState, not URL tokens

        ### Multi-Step Mutation Sequences
        - Check if code already handles failure ordering (e.g., generating data BEFORE status changes)
        - Pattern: Generate question → Start session → Create turn (question generated first, so failure leaves session in 'setup' status)
        - Don't suggest transaction/rollback when the code already sequences operations to avoid inconsistent states
        - Convex mutations are atomic per-mutation; cross-mutation atomicity is handled by operation ordering

chat:
  auto_reply: true
