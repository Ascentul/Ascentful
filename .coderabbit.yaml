# CodeRabbit Configuration
# Reduces false positive suggestions based on project patterns

version: 2

reviews:
  # Path filters - skip files that don't need code review
  path_filters:
    - "!docs/**"
    - "!**/*.md"
    - "!scripts/utils/**"
    - "!__mocks__/**"

  # Focus on actionable issues, reduce speculative suggestions
  auto_review:
    enabled: true
    drafts: false

  # Custom instructions for this codebase, applied to all files
  path_instructions:
    - path: "**/*"
      instructions: |
        ## Project Context
        This is a Next.js 14 + Convex + Clerk application for career development.

        ## Patterns to Accept (Don't Flag)

        ### Convex Type Safety
        - Trust Convex query/mutation results - validators enforce types at runtime
        - Don't suggest undefined/null guards for schema-validated fields (e.g., `status`, `stage`)
        - `v.id()` validators handle ID format validation - no additional guards needed
        - `v.union(v.literal(...))` ensures only valid enum values - no fallback guards needed
        - Schema uses `v.union(v.number(), v.null())` intentionally for clearable fields
        - String-based error detection (e.g., `includes('ArgumentValidationError:')`) is acceptable

        ### Authentication & convexServer Shim
        - `convexServer.query/mutation/action` accepts token as THIRD parameter (see src/lib/convex-server.ts)
        - The shim wraps token as `{ token }` internally - don't suggest removing token parameter
        - `requireConvexToken()` handles auth validation and returns `{ userId, token }`
        - Clerk `publicMetadata.role` is the source of truth for authorization
        - `getCurrentUser(ctx, args.clerkId)` validates clerkId against JWT - don't flag as insecure

        ### Error Handling Architecture
        - Dialog/modal components often delegate error handling to parent callbacks
        - Check CALLER functions for try-catch before suggesting error handling in child components
        - Errors that re-throw after toast allow parent to know operation failed
        - PII sanitization belongs at logging infrastructure level, not individual sanitizeError functions

        ### Idempotent Operations
        - Session cancellation is idempotent - status check is sufficient, no version check needed
        - Soft delete operations are idempotent - can be called multiple times safely
        - Don't suggest loading states to prevent double-clicks on idempotent button handlers
        - Dismiss/unsnooze/mark-as-read operations are safe to call multiple times
        - Adding loading states for idempotent operations is over-engineering
        - Don't suggest client-side refs to track if a mutation was called when backend handles deduplication
        - Example: Login tracking with "deduplication for sessions < 1 hour" doesn't need a `hasRecordedLoginRef`

        ### Performance
        - Don't suggest index optimizations without evidence of actual performance issues
        - Don't flag one-time migration scripts for pagination unless dataset is large
        - Don't suggest batching Promise.all calls into single mutations without evidence of performance issues
        - Per-user notification counts are small (dozens) - batch mutations are premature optimization
        - Promise.all is parallel, so latency is max of individual calls, not sum
        - Don't suggest converting dynamic imports to static imports in Convex handlers
        - Dynamic imports are cached after first call - "latency per invocation" claim is misleading
        - Module caching persists for isolate lifetime, so only cold starts have any overhead

        ### Testing
        - Mock implementations in `__mocks__/` are intentionally simplified
        - Don't suggest making test mocks more realistic unless tests are failing

        ### Style
        - Don't suggest documentation-only changes
        - Don't flag null vs undefined unless it causes actual bugs
        - Stage vs status case differences are intentional (title case for new, lowercase for legacy)

        ### University Invite Flow
        - Invite tokens are validated server-side via `/api/university/verify-invite` BEFORE setting `unsafeMetadata`
        - The Clerk webhook does NOT use `unsafeMetadata` - it looks up user's `university_id` from Convex database
        - Don't suggest re-verifying invite tokens in webhooks - they're already validated before signup

        ### Audit Logs & Timestamps
        - Audit logs always have either `created_at` (new format) or `timestamp` (legacy format)
        - `createAuditLog` helper always sets `created_at: Date.now()`
        - Fallback timestamps are defensive guards for theoretical data corruption, not expected code paths
        - Don't suggest replacing `Date.now()` fallbacks with "Unknown" strings

        ### Accessibility
        - Elements with `role="button"` containing visible text get accessible names from content (WCAG)
        - Don't suggest adding `aria-label` to clickable cards/elements that contain descriptive text
        - Only suggest `aria-label` when interactive elements have NO visible text content

        ### Async Patterns
        - Fire-and-forget async calls are intentional when `setIsLoading(true)` runs synchronously at function start
        - Example: `handleQuickAction() { handleAsync(); }` is fine if `handleAsync` sets loading state first
        - Don't suggest adding `await` to wrapper functions that just trigger async operations
        - The synchronous state update disables buttons before any async work begins
        - Don't suggest adding `void` prefix to fire-and-forget calls - it's stylistic with no functional benefit
        - Callback handlers (onClick, onDelete) that delegate to parent don't need await or loading states

        ### React Query (TanStack Query)
        - `useMutation` return objects are stable references - safe to include in useEffect dependencies
        - Don't suggest extracting `.mutate` to separate refs - the mutation object itself is stable
        - Guards like `!mutation.isPending` in useEffect conditions prevent re-calling during pending state
        - React Query mutations do NOT cause infinite loops when included in dependency arrays

        ### Transient UI State
        - Don't suggest persisting transient UI state (toast counts, last seen counts) to localStorage
        - Component re-mount resetting state is normal and acceptable React behavior
        - localStorage adds complexity (sync issues, stale data across tabs) for minor UX edge cases
        - Toast timing edge cases on navigation are acceptable - users see the UI directly

        ### React State Patterns
        - Functional updates `setState((prev) => ...)` execute synchronously within the same tick
        - Refs set inside functional update callbacks are available immediately after the setState call
        - Pattern: `setHistoryState((prev) => { ref.current = value; return newState; }); return ref.current;` is valid
        - Don't suggest reading state directly instead of functional updates - that introduces stale closures
        - React 18 batching doesn't change synchronous execution of functional update callbacks

        ### Environment Variables
        - Don't suggest renaming environment variables for "consistency" - breaking changes with no functional benefit
        - Existing env var names (e.g., ADZUNA_APPLICATION_ID) should be preserved

        ### Authorization Layer Architecture
        - Ownership/permission checks often exist at the Convex data layer, not the API route
        - Check Convex query/mutation handlers before suggesting "missing" authorization in API routes
        - Pattern: API route calls `getSession({ sessionId })` → Convex query validates user owns session
        - Don't flag "missing ownership validation" without checking the Convex function implementation

        ### Webhook Security Models
        - Gmail uses URL token verification (GMAIL_PUBSUB_VERIFICATION_TOKEN)
        - Outlook uses clientState hash validation in the notification payload
        - Both are valid security models - don't suggest one should match the other
        - Microsoft Graph webhooks validate via clientState, not URL tokens

        ### Multi-Step Mutation Sequences
        - Check if code already handles failure ordering (e.g., generating data BEFORE status changes)
        - Pattern: Generate question → Start session → Create turn (question generated first, so failure leaves session in 'setup' status)
        - Don't suggest transaction/rollback when the code already sequences operations to avoid inconsistent states
        - Convex mutations are atomic per-mutation; cross-mutation atomicity is handled by operation ordering

        ### Profile Section Architecture (SharedProfileLayout)
        - Sections are divided into "manual save" (basic-info, preferences, experience, links) and "auto-save" (education, certifications, etc.)
        - The top-level "Update" button is intentionally NOT disabled by child ref.isSaving because:
          - Error handling with toasts happens in section components
          - setIsSaving(false) in SharedProfileLayout's finally block handles cleanup
          - Auto-save sections don't use the top-level button at all
        - Don't suggest disabling the Update button based on section ref.isSaving - this is intentional architecture
        - Don't suggest adding isSaving to auto-save section toggle handlers - they use optimistic updates with Convex
        - `isInitialized` pattern is ONLY for manual-save sections to prevent reactive query overwrites during editing
        - Don't suggest `isInitialized` for auto-save sections (certifications, education, projects, etc.) - reactive refresh is desired there

        ### Convex Schema Field Nullability
        - Fields like `v.union(v.string(), v.null())` vs `v.optional(v.string())` are intentional
        - Don't suggest making schema fields nullable without understanding the data model
        - Changing schema field types can break existing data - this requires migration planning
        - Optional fields (`v.optional()`) mean "can be omitted", nullable fields (`v.null()`) mean "explicitly set to null"

        ### Background Job UI Feedback
        - When mutations schedule background jobs via `ctx.scheduler.runAfter()`, the mutation returns immediately
        - Fixed-duration UI states (e.g., `setTimeout(() => setScanningProvider(null), 3000)`) are intentional UX approximations
        - Don't suggest tying UI state to "actual completion" when the operation runs asynchronously via scheduled jobs
        - Convex reactive queries automatically update the UI when background jobs write results to the database
        - Toast messages already set user expectations (e.g., "Results will appear shortly")

        ### Service Worker Notification Actions
        - Service workers can't make authenticated API calls without a client window
        - Silent fail with warning log is acceptable when `clients.matchAll()` returns no clients
        - Don't suggest IndexedDB storage for pending notification actions - adds complexity for rare edge case
        - Don't suggest opening app URL as fallback - user loses context about original action
        - Users can handle missed notification actions via in-app UI when they next open the app

        ### Suspense Boundaries
        - Suspense wrappers around page content are intentional even when Convex queries don't suspend
        - They future-proof for React.lazy() code-splitting and are a standard Next.js pattern
        - Each component handles its own loading state for Convex queries (checking undefined)
        - Don't suggest removing Suspense boundaries just because current data-fetching doesn't suspend

        ### URL Handle Extraction
        - Simple string parsing for social media handles is intentional
        - Don't suggest adding complexity for unlikely edge cases (e.g., trailing slashes with no handle)
        - The `buildUrl` function validates on save and handles edge cases appropriately
        - Over-engineering for theoretical edge cases adds maintenance burden without real benefit

        ### Range Validation (Salary, etc.)
        - Allowing min === max in range validations is intentional (e.g., `salaryMin > salaryMax` not `>=`)
        - Equal min/max represents "exactly $X" which is a valid user intent even when using range UI
        - Don't suggest stricter inequality - disallowing equal values creates frustrating UX for users wanting exact amounts
        - Functionally, equal min/max behaves the same as an exact value

        ### Auto-Save Section Interface Consistency
        - Auto-save sections (certifications, education, projects) expose `handleSave` via ref for interface consistency
        - The parent SharedProfileLayout doesn't actually call `handleSave` for auto-save sections
        - Don't suggest removing "duplicate" save logic - inline auto-save + ref method serves different purposes
        - The ref interface allows uniform handling across all section types even if not actively used

        ### Form Validation (Minimal by Design)
        - Form dialogs intentionally use minimal validation (e.g., only checking primary identifier like `formName`)
        - Additional fields are optional to allow flexibility - users may not have all information immediately
        - This is consistent across sections: Education, Projects, Experience, Certifications all follow this pattern
        - Don't suggest adding required validation for optional fields - it creates unnecessary friction

        ### Native HTML Button Accessibility
        - Native `<button>` elements automatically handle keyboard accessibility (Enter and Space keys)
        - Don't suggest adding redundant `onKeyDown` handlers for Enter/Space to native buttons
        - Adding explicit keyboard handlers to native buttons is an anti-pattern that can interfere with default behavior
        - Only add keyboard handlers when using non-button elements (div, span) as interactive controls

        ### String Methods vs Regex
        - Prefer `startsWith()`, `endsWith()`, `includes()` over regex for simple prefix/suffix/contains checks
        - Don't suggest replacing `startsWith('http')` with regex like `/^https?:\/\//` - they are functionally equivalent
        - `startsWith('http')` correctly handles both 'http://' and 'https://' URLs
        - Simple string methods are more readable and performant than regex for basic operations

        ### Data Source Consistency (Clerk vs Convex)
        - In profile/form components, Convex user data is the source of truth for display and editing
        - Don't suggest reading directly from Clerk (`clerkUser`) when the component already uses Convex queries (`convexUser`)
        - User data is synced from Clerk to Convex via webhooks - Convex is the canonical data store for forms
        - Exception: Authorization checks should use Clerk `publicMetadata` (per CLAUDE.md role architecture)
        - The comment "from Clerk" in profile forms refers to data that was originally synced from Clerk, not live Clerk reads

        ### useEffect Callback Dependencies
        - Don't suggest memoizing parent callbacks when useEffect already has guards preventing unnecessary work
        - Pattern: `if (condition) { onChange(...) }` prevents infinite loops even with unmemoized callbacks
        - Speculative "extra render" concerns are not actionable when the effect has early-exit conditions
        - Don't push memoization responsibility to consumers when the component handles it safely

        ### Premature Abstraction
        - Don't suggest extracting helper functions for single-use logic under 10 lines
        - Inline code is often clearer than jumping to a named function for simple transformations
        - "Reusability" and "testability" arguments are weak for one-off logic with no actual reuse
        - Only suggest extraction when: logic is used multiple times, is complex (>10 lines), or has independent meaning
        - Simple aggregation loops (count/sum patterns) within the same file don't need extraction
        - For ~10 line loops that are duplicated 2-3 times in one file, inline is still acceptable if the pattern is clear

        ### Internal Component API Contracts
        - Don't suggest adding defensive validation for internal component props
        - Internal components don't need extensive API documentation for theoretical misuse
        - Example: A trend badge with `{ value, direction }` doesn't need guards against `{ value: -5, direction: 'up' }`
        - Trust that internal callers use props as intended - add validation only when actual bugs occur

        ### Intentional Fallback Patterns
        - Don't suggest making fields required when code has intentional fallbacks like `value || 'Default'`
        - Pattern `advisorName || 'Advisor'` means the field is intentionally optional with graceful degradation
        - Fallbacks provide better UX than rejecting requests for missing optional data
        - Making optional fields required would be a breaking change for existing callers

        ### Convex Query Pagination Constraints
        - Don't suggest pushing all filters to DB when role-based filtering requires in-memory Sets
        - Convex `.paginate()` follows index order, not custom sort orders like `priority + triggered_at`
        - Role-scoped access control (e.g., `allowedStudentIds` Set) cannot be expressed as index queries
        - In-memory filtering after `.collect()` is acceptable when:
          - Role-based filtering requires computed Sets of allowed IDs
          - Custom multi-field sorting is needed (not directly indexable)
          - Dataset size is bounded (e.g., signals per university are dozens to low hundreds)
        - Only suggest pagination optimization when there's evidence of actual performance issues at scale

        ### Batch Processing Cursor Patterns
        - Internal batch jobs (internalMutation/internalAction) using `_id > cursor` pattern are intentional
        - Don't suggest replacing manual ID-based cursors with `.paginate()` for scheduled/cron jobs
        - Convex `.paginate()` returns opaque cursors designed for client-facing APIs, not batch processing
        - Pattern: `filter((q) => q.gt(q.field('_id'), cursorId))` is valid for batch continuation
        - Returning `lastProcessedId` for scheduler continuation is preferred over opaque cursors
        - Manual cursors give explicit control needed for scheduled job retries and monitoring

        ### Bounded Analytics Queries
        - Analytics queries intentionally filter by `created_at` to bound the query scope
        - Don't suggest widening fetches to include all historical records for resolution/update tracking
        - Comment patterns like "avoid unbounded query" indicate intentional performance tradeoffs
        - Tracking "created and resolved in period" is acceptable approximation vs fetching entire table
        - For exact resolution tracking across all time, would need separate `resolved_at` index + query
        - The marginal accuracy improvement rarely justifies the query cost at scale

        ### One-Time Migration Scripts & Seed Scripts
        - Migration scripts in `convex/migrations/` are intentionally isolated and may duplicate patterns
        - Seed scripts (e.g., `seed_activity_events.ts`) are development tooling with similar isolation
        - Don't suggest DRY refactoring for migrations/seeds - isolation prevents cascading breakage
        - Don't flag query inefficiency in migrations unless processing millions of records
        - Migration/seed utilities run infrequently - optimize for correctness over elegance
        - Pattern: `collect()` + in-memory processing is acceptable for bounded migration datasets
        - Don't suggest importing shared constants into seed scripts to avoid circular dependencies

        ### Fuzzy Matching Edge Cases
        - Jaccard similarity returning 0 for empty sets is acceptable conservative behavior
        - Don't suggest special-casing edge cases in fuzzy matching unless it causes incorrect results
        - Conservative fallback to 0 similarity for edge cases prevents false positive matches
        - Pattern: `if (union === 0) return 0` is intentional - no tokens means no similarity

        ### Signal Evaluation Logic
        - Read the FULL evaluation logic before suggesting edge case fixes
        - Engagement drop evaluations already handle undefined previousLevel via index checks
        - Pattern: `prevIdx >= 0 && ...` ensures we only trigger when previous state is known
        - Don't suggest adding `return false` for edge cases that are already handled by existing guards

        ### Dialog Error Retry Pattern
        - When a dialog action fails (delete, update), NOT resetting state (e.g., `deletingId`) is intentional
        - Dialog stays open on error so user can see the error toast and retry
        - Resetting tracking IDs in catch blocks would break retry functionality
        - Pattern: Success path resets state + closes dialog; error path shows toast only
        - Don't suggest adding state resets in catch blocks for dialog confirmation handlers

        ### 'use client' Directive Consistency
        - Don't suggest removing `'use client'` from presentational components for "minor optimization"
        - Keeping the directive on all client-side components ensures consistency across the codebase
        - Components may later add hooks, event handlers, or browser APIs - the directive future-proofs them
        - The SSR benefit of removing it is marginal for small presentational components
        - Pattern: If a component lives in a client-side feature folder, keep `'use client'` for consistency

        ### Self-Documenting API Response Fields
        - Don't suggest adding comments or documentation for clearly-named response fields
        - Pattern: `shouldRemove: true` in API responses is self-explanatory - callers should remove the item
        - Metadata flags like `expired`, `shouldRetry`, `shouldRemove` don't need inline documentation
        - API response contracts are established by field names - callers understand their responsibility
        - Don't suggest "document that callers must handle X" when the field name makes intent clear

        ### Simple Delete Confirmations
        - `window.confirm` is acceptable for simple delete operations inside dropdowns/menus
        - Don't suggest replacing window.confirm with custom dialog components unless UX requires it
        - Dropdown closing before confirmation appears is expected behavior, not a bug
        - Users don't need dropdown context during confirmation - they know what they clicked
        - Simpler implementations are preferred over custom dialog state management for basic confirms

        ### Deprecated APIs in Telemetry/Diagnostic Code
        - Don't flag deprecated APIs when used for non-critical telemetry or diagnostic data
        - Pattern: `navigator.platform` in device info collection is acceptable - it's informational only
        - Replacement APIs (e.g., `navigator.userAgentData`) may have limited browser support
        - Low-priority deprecation warnings for diagnostic data don't justify breaking changes
        - Focus deprecation concerns on business-critical code paths, not telemetry

        ### TODO Comments Are Not Actionable Suggestions
        - Don't suggest implementing features described in TODO comments as part of PR review
        - TODOs are intentional placeholders for planned future work, not oversights
        - Feature requests should come from product requirements, not code review
        - Pattern: `// TODO: Implement X` indicates acknowledged future work, not a bug
        - Offering to "help implement" a TODO is a feature request, not a code quality issue

        ### Data Integrity Checks vs Authorization Checks
        - Don't confuse data integrity checks with authorization checks
        - Authorization is handled via `assertUserAccess`, `assertUniversityAccess`, etc. at the top of handlers
        - Subsequent checks like `existing.user_id !== userId` are data integrity checks, not security checks
        - Pattern: After `assertUserAccess(ctx, actingUser, args.userId)`, comparing against `args.userId` is correct
        - This pattern prevents data collisions (e.g., one push endpoint registered to multiple users)
        - The authorization layer already verified the acting user can manage the target userId
        - Don't suggest replacing `userId` with `actingUser._id` when checking for existing resource ownership
        - Misleading comments (e.g., "acting user owns") don't mean the code logic is wrong

        ### Mutually Exclusive Status Aggregates
        - Don't suggest `Math.max(0, ...)` guards for derived counts from mutually exclusive statuses
        - Pattern: `totalModerate = totalStudents - totalEngaged - totalAtRisk` is guaranteed non-negative
        - Engagement status is determined by a single deterministic function - students can't be in multiple categories
        - "Data issues" or "overlapping definitions" can't happen when the data model enforces exclusivity
        - Adding defensive guards would mask bugs rather than surface them
        - If aggregates somehow don't add up, it's a serious data integrity issue to investigate, not hide

        ### Convex ID Validation via TypeScript Casts
        - Don't suggest removing `as Id<'table'>` casts when passing IDs to Convex queries
        - Convex validators (`v.id('table')`) validate ID format at runtime before handlers execute
        - TypeScript `as` casts are compile-time only and don't bypass Convex validation
        - Pattern: `{ id: userInput as Id<'users'> }` is safe - Convex rejects invalid IDs with validation errors
        - Adding pre-validation is redundant when Convex query args use `v.id()` validators

        ### Mathematical Guarantees in Deterministic Calculations
        - Don't suggest division-by-zero guards for mathematically impossible scenarios
        - Linear regression with sequential indices (0, 1, 2, ...) has non-zero denominator when n >= 2
        - Pattern: `sumXX - sumX * sumX / n` is guaranteed positive for non-degenerate data
        - Algorithm guards like `if (n < 2) return null` already handle degenerate cases
        - Adding redundant Math guards clutters code and masks real logic bugs

        ### Internal Migration and Seed Utilities Have Different Constraints
        - Don't apply production-level performance optimizations to internal scripts
        - Pattern: `internalQuery`/`internalMutation` in `convex/migrations/` are developer tools
        - Pattern: `seed_*.ts` files are for populating test/dev data, not production workloads
        - Adding arbitrary `.take(N)` limits to stat functions produces incorrect statistics
        - Clipping results (e.g., `.take(100000)`) silently gives wrong percentages/counts
        - Convex query time limits already provide natural bounds for runaway queries
        - Seed scripts run on small dev datasets where sequential processing is acceptable
        - If large-scale aggregation is truly needed, suggest restructuring, not arbitrary limits

        ### Time-Series Data Ordering Is Guaranteed by Construction
        - Don't suggest sorting time-series data before slicing when the API builds it in order
        - Pattern: Loops like `for (i = n-1; i >= 0; i--)` iterating from oldest to newest guarantee order
        - APIs that construct arrays chronologically via iteration don't need post-sort
        - `slice(-1)` and `slice(-7)` are correct when the underlying data is built oldest-first
        - Check the data source before suggesting defensive sorting

        ### TypeScript Union Types Guarantee Object Key Lookups
        - Don't suggest fallbacks for object lookups when the key type exactly matches the object's keys
        - Pattern: `CONFIG[status]` where status is `'a' | 'b' | 'c'` and CONFIG has keys `{a, b, c}`
        - TypeScript enforces at compile time that only valid keys can be used
        - Convex validators further enforce at runtime for API data
        - Adding `?? fallback` would hide bugs - invalid keys should surface errors, not default silently
        - If types match keys exactly, the lookup is guaranteed safe

        ### Convex useQuery Error Handling
        - Don't suggest adding per-component error handling for Convex queries
        - Convex `useQuery` doesn't return an `error` property like React Query
        - Pattern: `undefined` return means loading state only - not error state
        - Server-side errors are thrown as exceptions, caught by React Error Boundaries
        - Network failures trigger automatic retries built into Convex client
        - Error boundaries should be at app/layout level, not individual components
        - Don't suggest timeouts/fallbacks for "stuck loading" - Convex handles retries automatically

        ### Schema-Aware Fallback Patterns
        - Don't suggest adding status fallbacks without checking if the value exists in the schema
        - Pattern: `stage === 'Accepted'` without status fallback is correct when 'accepted' isn't a valid status value
        - TypeScript union types define valid values - check schema before suggesting "missing" fallbacks
        - Comments like "stage field is the canonical source" indicate intentional design, not oversight

        ### Data Retention Policy Is Intentional
        - Don't suggest preventing hard deletes in retention jobs without evidence of compliance requirements
        - Pattern: 90-day archive + 365-day purge is an industry-standard retention window
        - Gating deletes to only test universities would cause unbounded data growth
        - If audit/compliance requirements arise, proper solutions are:
          - Export to cold storage before purge
          - Dedicated audit log tables with longer retention
          - Not preventing all production deletes indefinitely
        - Signals older than 365 days have already been archived for 275+ days - data is preserved long enough
        - Retention policies balance compliance, performance, and storage costs

        ### Runtime Isolation Between Convex and Next.js
        - `convex/` and `src/` have separate runtime environments with different module resolution
        - Identical utility functions in both locations (e.g., `escapeHtml`) are INTENTIONAL duplication
        - Don't suggest importing from `src/` in Convex files or vice versa - runtime isolation prevents this
        - Check for comments like "NOTE: Intentionally duplicated" before flagging duplicate implementations
        - Pattern: `convex/lib/sanitizeHtml.ts` and `src/lib/utils.ts` may have identical functions - this is by design

        ### Progressive Loading Is a Valid UX Pattern
        - Don't suggest adding all queries to a single loading check when progressive loading is intentional
        - Pattern: `!dataA || !dataB` in loading check while `dataC` renders conditionally with `{dataC && ...}`
        - Progressive loading shows available content quickly while slower queries complete in background
        - Both unified loading and progressive loading are valid - this is a UX design choice, not a bug
        - Only suggest unified loading when there's evidence it improves UX (e.g., jarring content shifts)

        ### Silent localStorage Catch Blocks
        - Don't suggest adding debug logging to silent localStorage catch blocks
        - localStorage failures are expected in: SSR, incognito mode, storage quota exceeded, Safari private browsing
        - Pattern: `try { localStorage.setItem(...) } catch { /* Ignore */ }` is correct
        - Adding console.debug for expected failures creates noise in development
        - Comment `// Ignore parse errors` or `// Silently ignore` indicates intentional silent handling

        ### Tiny Pure Functions Don't Need Memoization
        - Don't suggest useCallback/useMemo for simple pure functions < 10 lines with basic operations
        - Pattern: Date formatting functions (e.g., `formatTimeSince`) recreated each render are negligible cost
        - useCallback/useMemo add overhead that exceeds the cost of recreating trivial functions
        - Only suggest memoization when: function is expensive (>10ms), passed to memoized children, or in dependency arrays
        - Extracting tiny functions outside component is style preference, not performance improvement

        ### Callback-based Error Handling Architecture
        - When components accept error callbacks (e.g., `onPermissionDenied`, `onError`), don't suggest duplicate inline error handling
        - Pattern: `usePushNotifications({ onSubscriptionError: (e) => toast(...) })` handles errors via callback
        - Adding fallback toasts in the component would risk duplicate error messages
        - Check hook/component props for error callbacks before suggesting missing error handling
        - The callback pattern allows parent to control error UX - child shouldn't override this

        ### Try-Catch Around JSON Parsing
        - Don't suggest Content-Type header checks when response.json() is already wrapped in try-catch
        - Pattern: `try { data = await response.json() } catch { throw new Error('Invalid response') }` handles non-JSON
        - try-catch is more robust than Content-Type checking - servers can lie about Content-Type
        - Content-Type check + try-catch is redundant - the try-catch alone is sufficient
        - Only suggest Content-Type check when there's no try-catch around JSON parsing

        ### IIFEs in JSX Are Valid Pattern
        - Don't suggest extracting IIFEs (Immediately Invoked Function Expressions) from JSX to useMemo/constants
        - Pattern: `{(() => { const data = transform(props); return <Chart data={data} />; })()}`
        - IIFEs keep data transformation close to its usage, improving code locality
        - This is a style preference - both patterns are valid React code
        - Only suggest extraction when: the same transform is used multiple times, or component is measurably slow

        ### Placeholder Functions with Documented Intent
        - Don't suggest removing or deprecating functions that return input unchanged when JSDoc explains why
        - Pattern: `/** Currently returns all items - route-level guards handle access */`
        - These functions provide stable APIs for future implementation and document architectural decisions
        - Comments like "currently returns all items" indicate intentional design, not incomplete code
        - The JSDoc serves as documentation for the access control architecture

        ### Hardcoded Values in Single-Use Handlers
        - Don't suggest making hardcoded values configurable when there's only one call site
        - Pattern: `resolutionType: 'action_taken'` in a resolve handler doesn't need to be a parameter
        - Add configurability when actual use cases require different values, not speculatively
        - YAGNI (You Aren't Gonna Need It) - add parameters when needed, not before

        ### Signal Condition Boundaries Are Semantic Distinctions
        - Don't suggest broadening signal conditions to cover edge cases that are semantically different
        - Pattern: `checkNoProgressCondition` requires `totalApplications > rejectionCount` intentionally
        - This distinguishes "stalled with active pipeline" from "pipeline exhausted (all rejected)"
        - Different edge cases often warrant different signals with different advisor actions
        - Example: "No progress" = keep trying with adjustments; "All rejected" = restart pipeline entirely
        - If an edge case seems uncovered, check for a separate signal handling that scenario

chat:
  auto_reply: true
