# CodeRabbit Configuration
# Reduces false positive suggestions based on project patterns

version: 2

reviews:
  path_filters:
    - "!docs/**"
    - "!**/*.md"
    - "!scripts/utils/**"
    - "!__mocks__/**"

  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "**/*"
      instructions: |
        ## Project Context
        Next.js 14 + Convex + Clerk career development app.

        ## Patterns to Accept (Don't Flag)

        ### Convex Type Safety
        - Trust Convex validators - they enforce types at runtime
        - Don't add guards for schema-validated fields
        - `v.id()`, `v.union(v.literal(...))` handle validation

        ### Authentication (CRITICAL SECURITY)
        - `convexServer.query/mutation/action` takes token as THIRD param (src/lib/convex-server.ts)
        - **Convex mutations MUST use JWT auth via `getAuthenticatedUser(ctx)` or `ctx.auth.getUserIdentity()`**
        - **NEVER accept required `clerkId` args in mutations** - client-supplied IDs can be spoofed
        - Optional `clerkId` is ONLY allowed for mutations called by server-side API routes
        - Clerk `publicMetadata.role` is source of truth for authorization
        - Flag any new mutation with `clerkId: v.string()` (required) as a security vulnerability

        ### Error Handling
        - Dialog components delegate error handling to parent callbacks
        - Check caller functions before suggesting try-catch in children

        ### Idempotent Operations
        - Don't suggest loading states for idempotent operations (dismiss, mark-read, soft delete)
        - Fire-and-forget async is OK when state update runs synchronously first

        ### Performance
        - Don't suggest index/pagination optimizations without evidence of issues
        - Promise.all is parallel - latency is max of calls, not sum
        - Dynamic imports are cached after first call

        ### React Patterns
        - `useMutation` returns stable refs - safe in useEffect deps
        - Don't suggest localStorage for transient UI state
        - Functional setState updates execute synchronously

        ### Convex Queries
        - `useQuery` returns undefined for loading, not error
        - Server errors throw exceptions caught by Error Boundaries
        - Don't suggest per-component error handling

        ### Authorization Architecture
        - Check Convex handlers before flagging "missing" API route auth
        - Ownership checks in Convex layer, not API routes

        ### Migration/Seed Scripts
        - Don't suggest DRY refactoring - isolation prevents cascading breaks
        - Don't flag inefficiency unless processing millions of records
        - Don't add arbitrary `.take(N)` limits - produces incorrect stats

        ### UI/UX Patterns
        - `window.confirm` acceptable for simple delete operations
        - Progressive loading (showing partial data) is valid UX choice
        - Silent localStorage catch blocks are intentional (SSR, incognito)

        ### Code Style
        - Don't suggest extracting helpers for single-use logic <10 lines
        - Don't add aria-label when element has visible text
        - Don't flag deprecated APIs in telemetry/diagnostic code
        - TODO comments are not actionable review items

        ### Data Patterns
        - Retention policy (90d archive + 365d purge) is intentional
        - Mutually exclusive status aggregates are guaranteed non-negative
        - Time-series built chronologically doesn't need post-sort

        ### Runtime Isolation
        - convex/ and src/ have separate runtimes - duplicate utils are intentional

    - path: "convex/**"
      instructions: |
        ## Convex-Specific Patterns

        ### Mutation Authentication (CRITICAL - Flag Violations)
        **All mutations must authenticate via JWT, not client-supplied clerkId.**

        CORRECT patterns:
        ```typescript
        // Pattern 1: Client-only mutations (preferred)
        const user = await getAuthenticatedUser(ctx);

        // Pattern 2: Mutations also used by API routes
        const identity = await ctx.auth.getUserIdentity();
        let user;
        if (identity) {
          user = await ctx.db.query('users').withIndex('by_clerk_id', q => q.eq('clerkId', identity.subject)).unique();
        } else if (args.clerkId) {  // Optional clerkId for API routes
          user = await ctx.db.query('users').withIndex('by_clerk_id', q => q.eq('clerkId', args.clerkId)).unique();
        }
        ```

        FLAG AS SECURITY VULNERABILITY:
        - `args: { clerkId: v.string(), ... }` - Required clerkId in mutations
        - `const user = await getCurrentUser(ctx, args.clerkId)` without JWT check first

        ACCEPTABLE:
        - `clerkId: v.optional(v.string())` - Optional fallback for API routes
        - Queries using clerkId (queries can't be called without auth context)

        ### Batch Processing
        - ID-based cursors (`_id > cursor`) preferred over `.paginate()` for cron/batch jobs
        - `.collect()` + in-memory filter acceptable when role-based filtering needs computed Sets

        ### Signal Evaluation
        - Read FULL evaluation logic before suggesting edge case fixes
        - Condition boundaries are semantic distinctions, not oversights

        ### Schema
        - `v.union(v.string(), v.null())` vs `v.optional(v.string())` are intentional
        - Don't suggest schema changes - requires migration planning

    - path: "src/components/**"
      instructions: |
        ## Component Patterns

        ### Profile Sections (SharedProfileLayout)
        - Manual-save vs auto-save sections are intentional
        - Don't suggest `isInitialized` for auto-save sections
        - Top-level Update button not disabled by child isSaving - intentional

        ### Form Validation
        - Minimal validation is intentional - only primary identifier required
        - Optional fields allow flexibility

        ### Accessibility
        - Native buttons handle keyboard automatically
        - Don't add onKeyDown for Enter/Space to native buttons

        ### Memoization
        - Don't suggest useCallback/useMemo for tiny pure functions (<10 lines)
        - Only memoize when expensive or in dependency arrays

    - path: "src/app/api/**"
      instructions: |
        ## API Route Patterns

        ### Authentication
        - API routes MUST verify auth via `auth()` from Clerk before calling Convex
        - When calling Convex mutations, pass `clerkId` as optional param (the mutation validates via JWT first)
        - API routes are server-side so they can pass clerkId as fallback when JWT context unavailable

        ### Convex Calls from API Routes
        ```typescript
        // CORRECT: API route verifies auth, passes clerkId as optional fallback
        const { userId } = await auth();
        if (!userId) return new Response("Unauthorized", { status: 401 });
        await convexClient.mutation(api.contacts.createContact, {
          name: "John",
          clerkId: userId,  // Optional fallback - mutation prefers JWT
        });
        ```

        ### JSON Construction in Scripts
        - Use `jq` for JSON escaping to prevent injection: `jq -n --arg token "$VAR" '{key: $token}'`
        - Never use `printf '{"key":"%s"}' "$VAR"` - vulnerable to special characters

chat:
  auto_reply: true
